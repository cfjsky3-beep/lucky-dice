</style></head><body><div class="layout"><aside class="nav"><div class="brand"><small>导航</small><h1>幸运骰子<br>游戏设计</h1><span>客户端设计文档 · v1.1</span></div><button class="active" data-surface="client"><b>客户端</b><span>原型与设计说明</span></button><button data-surface="control"><b>中控后台</b><span>预留</span></button><button data-surface="merchant"><b>商户后台</b><span>预留</span></button><button data-surface="data"><b>初始化数据</b><span>预留</span></button><footer><a href="设计说明.md" style="color:#e5cf9c" download>下载可编辑说明</a></footer></aside><section class="preview"><div class="toolbar"><span>同屏预览 · 不缩放</span><select id="size" aria-label="预览尺寸"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="375,667">375 × 667</option><option value="430,932">430 × 932</option></select><a href="index.html" target="_blank">独立打开 ↗</a></div><div class="phone" id="phone"><iframe id="game" title="幸运骰子交互原型"></iframe></div><p class="note">动画与投注同屏展示；预览高度随当前窗口适配。尺寸选项为设备上限，不增加手机内滚动。</p></section><section class="doc"><div class="docHead"><small>区块链游戏 / 客户端 / 移动端与桌面端</small><h2>幸运骰子 · 游戏设计说明</h2><p>玩法、交互、界面与美术动效的统一设计依据</p><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="搜索当前分类…" aria-label="搜索当前分类"></div><div class="body" id="body"></div></section></div><script>const data=[{"title":"玩法规则","sections":[{"id":"s0-0","title":"01 / 已确认规则总表","html":"\u003ch3>01 / 已确认规则总表\u003c/h3>\u003ctable>\u003ctr>\u003ctd>项目\u003c/td>\u003ctd>规则\u003c/td>\u003ctd>边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开奖\u003c/td>\u003ctd>两颗六面骰子，各1–6点，以总和判断获胜区\u003c/td>\u003ctd>总和2–12；对子无特殊处理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小点数\u003c/td>\u003ctd>2–6，倍率2.3\u003c/td>\u003ctd>包含2和6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>幸运七\u003c/td>\u003ctd>7，倍率5.6\u003c/td>\u003ctd>只包含7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大点数\u003c/td>\u003ctd>8–12，倍率2.3\u003c/td>\u003ctd>包含8和12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>区域互斥\u003c/td>\u003ctd>同局不可同时持有小点数与大点数\u003c/td>\u003ctd>跨次追加也校验；7可与任一侧组合\u003c/td>\u003c/tr>\u003ctr>\u003ctd>额外抽水\u003c/td>\u003ctd>无额外抽水\u003c/td>\u003ctd>不等于100%理论返奖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自动能力\u003c/td>\u003ctd>自动局数、自动止盈、自动止损\u003c/td>\u003ctd>独立于手动模式，启动时锁参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查询能力\u003c/td>\u003ctd>个人记录、开奖结果、走势、种子验证、音效\u003c/td>\u003ctd>个人记录从更多菜单进入\u003c/td>\u003c/tr>\u003c/table>"},{"id":"s0-1","title":"02 / 回合与胜负","html":"\u003ch3>02 / 回合与胜负\u003c/h3>\u003cp>回合为投注、停止投注并掷骰、结果结算三个阶段。投注阶段受理后扣减模拟可用余额，截止后停止新增和撤销。开奖明确展示两颗骰子的最终点数、总和、获胜区域；非获胜区域订单返还0。未投注也能观看。单局多个区域分别结算后汇总。\u003c/p>\u003cp>原型窗口为投注10秒、掷骰2秒、结果3秒，均为演示配置，正式时长待确认。弹窗和新手引导不暂停房间；切后台停止后续自动计划。原型恢复前台根据本地阶段推进，不伪称同步正式服务器时钟。\u003c/p>"},{"id":"s0-2","title":"03 / 金额、限额与精度","html":"\u003ch3>03 / 金额、限额与精度\u003c/h3>\u003ctable>\u003ctr>\u003ctd>项目\u003c/td>\u003ctd>原型配置\u003c/td>\u003ctd>正式状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>显示单位\u003c/td>\u003ctd>CNY，最小0.01\u003c/td>\u003ctd>资产及精度待确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单区域单笔\u003c/td>\u003ctd>1–30,000\u003c/td>\u003ctd>各区限红待确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单区域单局累计\u003c/td>\u003ctd>30,000\u003c/td>\u003ctd>待确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单局全部区域累计\u003c/td>\u003ctd>60,000\u003c/td>\u003ctd>最多两个可组合区域，各30,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最高返还\u003c/td>\u003ctd>不额外封顶\u003c/td>\u003ctd>正式返还封顶待确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>快捷金额\u003c/td>\u003ctd>1／100／1,000／5,000\u003c/td>\u003ctd>原型同界面观察值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>减半／翻倍\u003c/td>\u003ctd>减半向下到分，限制在1–30,000\u003c/td>\u003ctd>超过快捷边界只调整输入，不提交\u003c/td>\u003c/tr>\u003c/table>\u003cp>金额以整数分保存。输入必须是普通十进制正数、最多两位小数；空值、负数、指数、第三位小数、越界金额不受理，不自动降额投注。按钮旁合计金额＝每区金额×已选区域数；一次组合提交整体校验、整体成功或失败，避免部分扣款。追加订单重新校验互斥、单区累计和余额。\u003c/p>"},{"id":"s0-3","title":"04 / 结算公式与样例","html":"\u003ch3>04 / 结算公式与样例\u003c/h3>\u003cp>返还包含本金。获胜返还＝本金×倍率，向下舍入至0.01；净盈亏＝返还－本金。未获胜返还0。撤销成功原路返还本金，不计输赢。正式精度及舍入待结算负责人确认。\u003c/p>\u003ctable>\u003ctr>\u003ctd>示例\u003c/td>\u003ctd>返还\u003c/td>\u003ctd>净盈亏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100投2–6，结果1+5\u003c/td>\u003ctd>230\u003c/td>\u003ctd>+130\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100投7，结果3+4\u003c/td>\u003ctd>560\u003c/td>\u003ctd>+460\u003c/td>\u003c/tr>\u003ctr>\u003ctd>各100投小与7，结果2+3\u003c/td>\u003ctd>230\u003c/td>\u003ctd>+30（总本金200）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>各100投大与7，结果2+3\u003c/td>\u003ctd>0\u003c/td>\u003ctd>−200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.01投小，结果2+2\u003c/td>\u003ctd>2.32\u003c/td>\u003ctd>+1.31\u003c/td>\u003c/tr>\u003c/table>\u003cp>独立且均匀的双骰模型有36种等可能有序结果，小／大各15种，7有6种。若倍率含本金，理论返奖分别为15/36×2.3＝95.8333%、6/36×5.6＝93.3333%。这是基于模型的计算，正式结果分布待确认；无额外抽水不能写成无庄家优势。\u003c/p>"},{"id":"s0-4","title":"05 / 自动计划","html":"\u003ch3>05 / 自动计划\u003c/h3>\u003cp>局数选无限、10、30、50、100、1000；原型默认无限。有限次数仅在本局组合全部受理成功后消耗一次；拒绝不扣次数，并停止计划。每局最多自动提交一次。启动时保存区域、每区金额和止盈止损，运行中禁止改参和切模式；停止后可修改再启动。\u003c/p>\u003cp>止盈／止损为空表示不启用，否则为不少于1、最多两位小数的金额。按本计划已结算订单的累计净盈亏判断，达到或越过阈值，在结算后停止下一局。不是账户绝对余额，也不把未结算扣款当损失。原型禁止计划期间修改演示余额，保证基准一致。止损按局判断，可能超过阈值，不承诺亏损封顶。\u003c/p>\u003cp>点击停止、余额不足、参数非法、金额累计冲突、后台、离开或离线均停止后续计划；已受理订单继续结算。恢复余额、网络或重新进入不自动重启。停止后撤销本局订单不恢复已消耗局数。结果展示期间启动只预约计划，不扣款，下一投注窗口才尝试受理。\u003c/p>"},{"id":"s0-5","title":"06 / 随机性与种子验证","html":"\u003ch3>06 / 随机性与种子验证\u003c/h3>\u003cp>原型使用Web Crypto生成骰子，丢弃不适合六等分的32位尾部值，再取模映射1–6。每颗独立取样；种子为本地DEMO标识，与点数生成无映射关系，不能用其摘要声称开奖结果公平。用户输入原始字符串（UTF-8）计算SHA-256，展示64位十六进制、前8位及其无符号十进制。测试向量：abc → ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad；前8位ba7816bf，十进制3128432319。\u003c/p>\u003cp>正式需确认链、区块高度／种子来源、选定时点、预承诺、公开时点、哈希算法、截取、去偏映射、两骰生成、复算样例及订单关联。缺任何一项不得显示“开奖结果验证通过”。空种子不计算；复制保留完整值。\u003c/p>"},{"id":"s0-6","title":"07 / 历史、记录和统计","html":"\u003ch3>07 / 历史、记录和统计\u003c/h3>\u003cp>顶部最近7局总和，最新在左；点击查看两骰明细。走势最近20局，最新在前，显示各区次数和占比，分母为实际样本量；不足20按实有数，0局显示空态，不制造历史。占比取整可能不等于100%，仅用于回看。个人订单保留本设备最近200笔，显示期次、区域、本金、返还、净额、受理／已撤销／已结算状态。模拟动态单独标注，不计入本人余额和真实人数。\u003c/p>"},{"id":"s0-7","title":"08 / 断线、后台与恢复","html":"\u003ch3>08 / 断线、后台与恢复\u003c/h3>\u003cp>正式服务必须以服务端受理回执、截止时间、最终账本为准；超时进入结果未知，使用客户端幂等键查单，不自动重发或退款。重复回执按订单ID去重，结算只能入账一次。断线后停止自动，不取消已受理订单；重新进入查询当前房间与本人订单，再刷新余额。不得使用“断线保证无损”文案。\u003c/p>\u003cp>原型本地持久化余额和订单，刷新后将已受理未结算订单恢复为同一模拟结果并结算一次。此为演示恢复，不能替代正式已确定开奖结果。存储被清除／隐私模式／跨设备不保证记录恢复。闲置提醒与强制退出尚待正式规则，本期不沿用其他游戏的10／20分钟。\u003c/p>"}]},{"title":"交互说明","sections":[{"id":"s1-0","title":"01 / 输入、选择与提交","html":"\u003ch3>01 / 输入、选择与提交\u003c/h3>\u003cp>区域默认不选，点击切换选中；互斥选择拒绝并提示先取消当前区。7可以单选或组合；金额标签明确“每个已选区域”。输入非法、超限、余额不足均保留原输入、无订单、无扣款。提交按回合截止时间再校验，即使动画按钮尚未更新也不能越过截止。成功更新本局区域累计、余额与记录，并仅播放一次受理反馈。\u003c/p>\u003cp>正式提交状态为可提交→请求中（禁重入）→成功／明确失败／结果未知。未知时锁定同一请求，查单恢复。原型采用同步原子受理，不模拟接口延迟；正式请求中和幂等恢复待联调。\u003c/p>"},{"id":"s1-1","title":"02 / 操作状态矩阵","html":"\u003ch3>02 / 操作状态矩阵\u003c/h3>\u003ctable>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>主按钮／操作\u003c/td>\u003ctd>成功／失败及恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>投注中，手动\u003c/td>\u003ctd>投注\u003c/td>\u003ctd>组合整体受理；失败保留参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开奖／结果，手动\u003c/td>\u003ctd>等待下一局（禁用）\u003c/td>\u003ctd>下一投注窗口恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自动未运行\u003c/td>\u003ctd>启动自动\u003c/td>\u003ctd>当前窗口加入，否则下一局等待\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自动运行\u003c/td>\u003ctd>停止自动\u003c/td>\u003ctd>立即停止后续，本局持仓保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>受理中订单，未截止\u003c/td>\u003ctd>记录中撤销\u003c/td>\u003ctd>原型退本金一次；自动须先停止\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已截止／已结算\u003c/td>\u003ctd>不允许撤销\u003c/td>\u003ctd>提示并保留最终状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查询／验证／说明\u003c/td>\u003ctd>弹窗\u003c/td>\u003ctd>内部滚动，关闭恢复焦点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>返回大厅\u003c/td>\u003ctd>明确提示并离开\u003c/td>\u003ctd>停计划，订单保留；大厅协议待接入\u003c/td>\u003c/tr>\u003c/table>"},{"id":"s1-2","title":"03 / 记录、验证与反馈","html":"\u003ch3>03 / 记录、验证与反馈\u003c/h3>\u003cp>更多菜单从顶部打开，个人记录从菜单进入；走势从历史右端进入。复制成功有文字；权限失败显示完整可选字符串手工复制。验证空值提示；不支持摘要环境提示使用HTTPS／localhost，不伪造成功。弹窗支持关闭、遮罩和Escape，键盘焦点限制在弹窗中。金额和错误文字不被动画覆盖。\u003c/p>"},{"id":"s1-3","title":"04 / 新手引导与演示工具","html":"\u003ch3>04 / 新手引导与演示工具\u003c/h3>\u003cp>首次设备进入自动显示五步引导，支持跳过、菜单重看，本地存储完成标识。覆盖回合、区域、金额、自动、记录和验证。回合持续运行，引导不代下单。引导逐步用金色框标记真实操作区域，说明卡片在上下方避让；正式设备识别与跨端引导状态仍需接口定义。演示余额工具仅原型显示，受理中订单或自动运行时禁止修改。\u003c/p>"}]},{"title":"设计说明","sections":[{"id":"s2-0","title":"01 / 视觉与层级","html":"\u003ch3>01 / 视觉与层级\u003c/h3>\u003cp>采用独立的翡翠绿骰子桌视觉，暖金主操作和信息强调，白色骰子为舞台主体。小／七／大分别以蓝、铜、绿辅助识别，同时始终保留区间文本，不能只凭颜色。顶部按当地时间、游戏图标、名称、手机信号格和更多的顺序排列；中部历史、阶段倒计时、双骰和结果；底部三区、种子、模式、金额、快捷、自动条件与余额。底部不展示用户ID，保持余额区简洁。装饰不得遮挡核心操作。\u003c/p>"},{"id":"s2-1","title":"02 / 尺寸与适配","html":"\u003ch3>02 / 尺寸与适配\u003c/h3>\u003cp>390px原始宽度，支持320–430px；桌面保持手机比例。页面采用固定控制区＋弹性舞台，不整体缩小凑屏，不依赖下滑。短屏压缩舞台及装饰；弹窗和记录内部滚动。主按钮及金额步进按钮至少44px；部分历史、快捷及模式辅助控件为30–32px，低于44px目标，正式需扩大触控热区或重新分配高度。禁止把未验证的全控件44px标为通过。\u003c/p>"},{"id":"s2-2","title":"03 / 连接与模拟信息","html":"\u003ch3>03 / 连接与模拟信息\u003c/h3>\u003cp>顶部采用与一飞冲天一致的四根独立手机信号格，不显示“本地演示”等副标签。离线为0格；浏览器可提供effectiveType时按slow-2g／2g＝1格、3g＝2格、4g＝4格映射；无法获取强度时以灰色格展示未知，仅悬停和无障碍说明文字。此状态来自浏览器联网能力，不代表正式房间心跳。游戏界面去除本地演示／免费演示提示和底部用户ID，模拟实现范围保留在研发说明与验收记录。动态仍为原型生成数据，未接入真实房间。\u003c/p>"}]},{"title":"美术与动效及音效","sections":[{"id":"s3-0","title":"01 / 美术交付清单","html":"\u003ch3>01 / 美术交付清单\u003c/h3>\u003ctable>\u003ctr>\u003ctd>资源名\u003c/td>\u003ctd>用途／阶段\u003c/td>\u003ctd>尺寸／格式\u003c/td>\u003ctd>锚点／状态\u003c/td>\u003ctd>当前\u003c/td>\u003c/tr>\u003ctr>\u003ctd>game-icon\u003c/td>\u003ctd>顶部图标／入口\u003c/td>\u003ctd>256² SVG与PNG\u003c/td>\u003ctd>中心；常态\u003c/td>\u003ctd>字形占位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>table-background\u003c/td>\u003ctd>全阶段桌面\u003c/td>\u003ctd>860×1864分层源文件与WebP\u003c/td>\u003ctd>居中，可裁切四周；安全区320×568\u003c/td>\u003ctd>CSS占位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dice-1至dice-6\u003c/td>\u003ctd>投注待机／开奖／结果\u003c/td>\u003ctd>单颗256²透明PNG或SVG\u003c/td>\u003ctd>中心，保留阴影安全边\u003c/td>\u003ctd>CSS点阵实现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dice-shadow\u003c/td>\u003ctd>骰子下方阴影\u003c/td>\u003ctd>256×128透明WebP\u003c/td>\u003ctd>底部中心\u003c/td>\u003ctd>CSS实现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>result-low/mid/high\u003c/td>\u003ctd>结果强调\u003c/td>\u003ctd>矢量／透明WebP\u003c/td>\u003ctd>区域内，不越操作边界\u003c/td>\u003ctd>CSS光晕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>betting-panel\u003c/td>\u003ctd>区域／金额／模式\u003c/td>\u003ctd>矢量组件\u003c/td>\u003ctd>默认、选中、禁用、受理、异常\u003c/td>\u003ctd>HTML/CSS实现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>menus-modals\u003c/td>\u003ctd>菜单、记录、走势、验证\u003c/td>\u003ctd>矢量组件\u003c/td>\u003ctd>打开／关闭／空／异常\u003c/td>\u003ctd>HTML实现\u003c/td>\u003c/tr>\u003c/table>\u003cp>交付源文件、导出文件、尺寸、锚点、裁切安全区、命名版本及授权。舞台背景、骰子、光影、界面分层，禁止把文字和操作烘焙进背景。当前CSS占位不是正式三维骰子美术终稿。\u003c/p>"},{"id":"s3-1","title":"02 / 动效状态脚本","html":"\u003ch3>02 / 动效状态脚本\u003c/h3>\u003ctable>\u003ctr>\u003ctd>触发\u003c/td>\u003ctd>时长与路径\u003c/td>\u003ctd>打断／清理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>投注阶段\u003c/td>\u003ctd>骰子静置，倒计时每秒更新\u003c/td>\u003ctd>不预示未来点数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>投注成功\u003c/td>\u003ctd>区域累计／余额同步，轻确认\u003c/td>\u003ctd>每个受理事件一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>截止开奖\u003c/td>\u003ctd>2秒局部上下位移和轻转动，最终点阵对齐\u003c/td>\u003ctd>截止先禁受理，不等动画结束；无页面震动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结果\u003c/td>\u003ctd>点数、总和、获胜区同时定格；获胜区柔光3秒\u003c/td>\u003ctd>本人返还及净额独立显示，不能把旁观者标中奖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>下一局\u003c/td>\u003ctd>清理获胜光晕与本局累计，保留历史\u003c/td>\u003ctd>无跨局粒子或旧结果覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>减少动态\u003c/td>\u003ctd>去掉骰子晃动，保留阶段和最终点数\u003c/td>\u003ctd>不影响受理与结算\u003c/td>\u003c/tr>\u003c/table>\u003cp>最终点数先落定再展示总和；正式开奖动画以服务端已确定结果驱动，不能本地重新随机。补帧／后台恢复不补播旧摇骰或成功动效。原型点阵切换为演示占位，正式三维骰子需验收朝向和落面一致。\u003c/p>"},{"id":"s3-2","title":"03 / 音频事件与混音","html":"\u003ch3>03 / 音频事件与混音\u003c/h3>\u003cp>背景音乐与游戏音效独立音量、设备记忆；默认背景关闭，用户手势后解锁播放。背景为低干扰桌面氛围，骰子滚动、碰撞、落面为轻材质音；投注受理、撤销、自动停止、中奖、未中、异常、恢复分别定义短音。最后3秒倒数每秒一次，不循环催促，不叠播。本人结算优先于普通按钮，压低背景，不超过设备舒适响度。\u003c/p>\u003cp>当前实现合成受理／倒数／结算短音和背景单音占位；正式音乐、骰子音、撤销／异常音尚未制作。需交付WAV母带和网页压缩版、授权、循环接缝、响度基准、触发映射、淡入淡出。后台停止循环，恢复仅播放当前新事件；重复回执、打开记录不能再播成功音。静音仍有完整文字与视觉反馈。\u003c/p>"}]},{"title":"验收与待确认","sections":[{"id":"s4-0","title":"01 / 核心验收场景","html":"\u003ch3>01 / 核心验收场景\u003c/h3>\u003ctable>\u003ctr>\u003ctd>编号\u003c/td>\u003ctd>场景\u003c/td>\u003ctd>预期／状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-01\u003c/td>\u003ctd>枚举两骰36种结果\u003c/td>\u003ctd>区域15／6／15，边界正确；自动测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-02\u003c/td>\u003ctd>100投小、100投7，结果5\u003c/td>\u003ctd>返还230、净额30；自动测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-03\u003c/td>\u003ctd>低／高同选或跨提交\u003c/td>\u003ctd>拒绝互斥订单，无超扣；需浏览器验收\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-04\u003c/td>\u003ctd>1、30,000、30,000.01、负数、空、3位小数\u003c/td>\u003ctd>合法边界受理，非法不扣款；金额函数自动测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-05\u003c/td>\u003ctd>余额不足组合总额\u003c/td>\u003ctd>整组失败，不部分下注\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-06\u003c/td>\u003ctd>连点、截止同刻、重复结算\u003c/td>\u003ctd>不越截止、不重复入账；结算幂等自动测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-07\u003c/td>\u003ctd>自动10局、手动停止、止盈／止损\u003c/td>\u003ctd>按受理局计数，按结算净额停止，本局不取消\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-08\u003c/td>\u003ctd>后台、离线、刷新\u003c/td>\u003ctd>后续计划停；已受理订单保存并恢复唯一结算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-09\u003c/td>\u003ctd>SHA-256 abc向量、空值、复制失败\u003c/td>\u003ctd>摘要真实；不冒充点数验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-10\u003c/td>\u003ctd>首次引导、跳过、重看、弹窗\u003c/td>\u003ctd>不代下单，不暂停回合；真实区域高亮需窄屏验收\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-11\u003c/td>\u003ctd>320×568、375×667、390×844、430×932、桌面\u003c/td>\u003ctd>核心首屏可操作、弹窗内滚动；以实测证据为准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD-12\u003c/td>\u003ctd>静音、后台返回、减少动态\u003c/td>\u003ctd>无循环叠音，数字和最终点数保留\u003c/td>\u003c/tr>\u003c/table>"},{"id":"s4-1","title":"02 / 实现差距","html":"\u003ch3>02 / 实现差距\u003c/h3>\u003cp>已实现本地回合、三区选择、互斥、组合原子扣款、单区累计、手动追加／撤销、自动计划、止盈止损、记录、走势、摘要计算、音量、引导和余额工具。未接入真实用户／钱包／链／房间服务，未验证多人事件一致性。正式请求中、超时查单、跨设备恢复、服务端幂等和签名均待联调。全辅助控件44px热区、正式美术和音效未完成。QA报告单列真实检查结果，不将计划当完成。\u003c/p>"},{"id":"s4-2","title":"03 / 待确认清单与责任","html":"\u003ch3>03 / 待确认清单与责任\u003c/h3>\u003ctable>\u003ctr>\u003ctd>编号\u003c/td>\u003ctd>问题／影响\u003c/td>\u003ctd>责任角色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q01\u003c/td>\u003ctd>正式资产、链、钱包、托管、费用和资金确认时机\u003c/td>\u003ctd>产品＋链上负责人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q02\u003c/td>\u003ctd>投注、摇骰、结果时间及服务器时钟\u003c/td>\u003ctd>产品＋后端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q03\u003c/td>\u003ctd>各区域单笔／累计限额、最高返还\u003c/td>\u003ctd>产品＋结算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q04\u003c/td>\u003ctd>倍率是否含本金的正式合同口径、精度、舍入\u003c/td>\u003ctd>产品＋结算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q05\u003c/td>\u003ctd>7与两侧组合、追加／撤销截止及自动次数消耗\u003c/td>\u003ctd>产品＋后端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q06\u003c/td>\u003ctd>自动净额口径、断线与后台策略、止盈止损边界\u003c/td>\u003ctd>产品＋后端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q07\u003c/td>\u003ctd>完整种子来源、承诺、映射及复算向量\u003c/td>\u003ctd>链上／随机数负责人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q08\u003c/td>\u003ctd>记录保留期、分页、恢复、真实人数和模拟机器人策略\u003c/td>\u003ctd>产品＋后端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q09\u003c/td>\u003ctd>大厅返回协议、设备引导、闲置策略\u003c/td>\u003ctd>平台＋产品\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q10\u003c/td>\u003ctd>美术风格终稿、音频素材和低性能设备\u003c/td>\u003ctd>视觉／动效＋产品\u003c/td>\u003c/tr>\u003c/table>"},{"id":"s4-3","title":"04 / 交接与发布","html":"\u003ch3>04 / 交接与发布\u003c/h3>\u003cp>原型、组合页及本说明同仓同步生成；更新后继续使用该游戏独立GitHub仓库与Vercel固定生产域名。主页面为游戏，/design为设计说明。中控后台、商户后台、初始化数据本期空页，不擅自扩展后台或合约。正式上线前由对应责任角色确认Q项，接口联调完成后才替换模拟标识。\u003c/p>"},{"id":"s4-4","title":"05 / 统一界面规范更新","html":"\u003ch3>05 / 统一界面规范更新\u003c/h3>\u003cp>顶部与一飞冲天复用时间、图标、名称、手机信号格、更多菜单的顺序与尺寸；信号只读且无副标签。设计页沿用蓝灰导航与蓝色当前态，导航品牌区为“导航／幸运骰子／游戏设计／客户端设计文档 · v1.1”，删除英文PRODUCT DESIGN编号。保留骰子桌面的绿色主题与三区颜色，但统一历史、种子、模式与底部余额组件的间距和圆角。\u003c/p>"}]}];const prototype="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#102820\">\u003ctitle>幸运骰子 · LUCKY DICE\u003c/title>\u003cstyle>\n*{box-sizing:border-box} :root{color-scheme:dark;--gold:#e9c887;--muted:#a5baad;--line:#ffffff17;--blue:#82b9ff;--green:#85d3a4;--red:#f0aa84}body{margin:0;background:#081710;color:#f5f3e9;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#ffffff08;border-radius:10px;min-height:44px}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cu e=saved.balance;orders=Array.isArray(saved.orders)?saved.orders.slice(0,200):[];history=Array.isArray(saved.history)?saved.history.slice(0,20):[];round=(history[0]?.round||0)+1;last=history[0]||null}const p=JSON.parse(localStorage.getItem('lucky-dice-preferences'));if(p){soundLevel=p.sound??.35;musicLevel=p.music??0;noMotion=!!p.noMotion}}catch{}\n// Restore accepted unsettled orders to one final result before another round.\nfunction randomDie(){const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}\nfunction result(){const a=randomDie(),b=randomDie();return{a,b,sum:a+b,zone:zoneFor(a+b)}}\nfunction settleOrder(o,r){if(o.state!=='accepted')return;const ret=o.zone===r.zone?Math.floor(o.amount*Z[o.zone].rate/10):0;o.state='settled';o.returned=ret;o.profit=ret-o.amount;o.a=r.a;o.b=r.b;o.sum=r.sum;balance+=ret}\nconst pending=orders.filter(o=>o.state==='accepted');if(pending.length){const recovered=result();pending.forEach(o=>settleOrder(o,recovered));history.unshift({...recovered,round:Math.max(...pending.map(o=>o.round)),seed:'DEMO-RECOVERY-'+crypto.randomUUID(),time:new Date().toISOString()});history=history.slice(0,20);round=history[0].round+1;last=history[0]}\nfunction save(){try{localStorage.setItem('lucky-dice-state-v1',JSON.stringify({balance,orders:orders.slice(0,200),history:history.slice(0,20)}))}catch{}}\nfunction prefs(){try{localStorage.setItem('lucky-dice-preferences',JSON.stringify({sound:soundLevel,music:musicLevel,noMotion}))}catch{}}\nfunction toast(s){$('#status').textContent=s;$('#status').title=s}\nfunction tone(freq=600,duration=.08){if(!soundLevel||document.hidden)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(soundLevel*.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destinat t();$('#sum').textContent='掷骰中…';render()}else if(phase==='rolling')settle();else{round++;phase='betting';deadline=now+10000;$('#sum').textContent='选择你的幸运区间';render();autoBet()}}const sec=Math.max(0,Math.ceil((deadline-now)/1000));$('#count').textContent=sec+'s';if(phase==='betting'&&sec\u003c=3&&sec!==lastSecond)tone(500+sec*100,.045);lastSecond=sec;if(phase==='rolling'&&!noMotion){drawDie($('#die1'),randomDie());drawDie($('#die2'),randomDie())}if(now-feedTick>2500){feedTick=now;$('#feed').innerHTML='本局动态 · ***'+['ab','q7','m2','xy'][Math.floor(Math.random()*4)]+' \u003cb>'+['2–6','7','8–12'][Math.floor(Math.random()*3)]+'\u003c/b> · '+[10,100,1000][Math.floor(Math.random()*3)]}}\nwindow.addEventListener('pagehide',()=>{plan=null;save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&plan)stopPlan('页面进入后台，后续自动计划已停止');music();if(!document.hidden)tick()});window.addEventListener('offline',()=>{if(plan)stopPlan('网络离线，自动计划已停止');renderConnection();toast('网络已断开，请检查连接')});window.addEventListener('online',()=>{renderConnection();toast('网络连接已恢复')});\nfunction renderConnection(){const signal=$('#network');const type=navigator.connection?.effectiveType;const strength=navigator.onLine===false?0:({'slow-2g':1,'2g':1,'3g':2,'4g':4}[type]??'unknown');signal.dataset.strength=strength;signal.title=strength==='unknown'?'已连接 · 信号强度未知':strength===0?'未连接':'连接质量 '+strength+'/4';signal.setAttribute('aria-label',signal.title)}\ndrawDie($('#die1'),last?.a||3);drawDie($('#die2'),last?.b||4);render();tick();setInterval(tick,150);try{if(!localStorage.getItem('lucky-dice-guide'))panel('guide')}catch{}\n\u003c/script>\u003c/body>\u003c/html>\n";document.getElementById('game').srcdoc=prototype;let category=0,surface='client';const q=s=>document.querySelector(s);function render(){if(surface!=='client'){q('#tabs').innerHTML='';q('#body').innerHTML='<div class="empty"></div>';q('#search').disabled=true;q('.preview').style.visibility='hidden';return}q('.preview').style.visibility='visible';q('#search').disabled=false;q('#tabs').innerHTML=data.map((x,i)=>'<button data-tab="'+i+'" class="'+(i===category?'on':'')+'">'+x.title+'</button>').join('');q('#body').innerHTML='<div class="toc">'+data[category].sections.map(s=>'<button data-jump="'+s.id+'">'+s.title+'</button>').join('')+'</div>'+data[category].sections.map(s=>'<article class="card" id="'+s.id+'">'+s.html+'</article>').join('');q('#body').scrollTop=0;q('#search').value='';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{category=Number(b.dataset.tab);render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({block:'start'}))}q('#search').oninput=()=>{const term=q('#search').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(term)))};document.querySelectorAll('[data-surface]').forEach(b=>b.onclick=()=>{surface=b.dataset.surface;document.querySelectorAll('[data-surface]').forEach(x=>x.classList.toggle('active',x===b));render()});q('#size').onchange=()=>{const [w,h]=q('#size').value.split(',');q('#phone').style.width=w+'px';q('#phone').style.height=h+'px'};render();</script></body></html>
