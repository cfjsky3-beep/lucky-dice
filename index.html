// Local demonstration only. All money is represented as integer cents.
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const Z={low:{name:'2–6',rate:23},mid:{name:'7',rate:56},high:{name:'8–12',rate:23}};
const money=n=>(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const zoneFor=n=>n<7?'low':n===7?'mid':'high';
function parseMoney(s){if(!/^\d+(\.\d{1,2})?$/.test(String(s).trim()))return null;const n=Math.round(Number(s)*100);return Number.isSafeInteger(n)?n:null}

try{const saved=JSON.parse(localStorage.getItem('lucky-dice-state-v1'));if(saved&&Number.isSafeInteger(saved.balance)&&saved.balance>=0){balance=saved.balance;orders=Array.isArray(saved.orders)?saved.orders.slice(0,200):[];history=Array.isArray(saved.history)?saved.history.slice(0,20):[];round=(history[0]?.round||0)+1;last=history[0]||null}const p=JSON.parse(localStorage.getItem('lucky-dice-preferences'));if(p){soundLevel=p.sound??.35;musicLevel=p.music??0;noMotion=!!p.noMotion}}catch{}
// Restore accepted unsettled orders to one final result before another round.
function randomDie(){const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}
function result(){const a=randomDie(),b=randomDie();return{a,b,sum:a+b,zone:zoneFor(a+b)}}
function settleOrder(o,r){if(o.state!=='accepted')return;const ret=o.zone===r.zone?Math.floor(o.amount*Z[o.zone].rate/10):0;o.state='settled';o.returned=ret;o.profit=ret-o.amount;o.a=r.a;o.b=r.b;o.sum=r.sum;balance+=ret}
const pending=orders.filter(o=>o.state==='accepted');if(pending.length){const recovered=result();pending.forEach(o=>settleOrder(o,recovered));history.unshift({...recovered,round:Math.max(...pending.map(o=>o.round)),seed:'DEMO-RECOVERY-'+crypto.randomUUID(),time:new Date().toISOString()});history=history.slice(0,20);round=history[0].round+1;last=history[0]}
function save(){try{localStorage.setItem('lucky-dice-state-v1',JSON.stringify({balance,orders:orders.slice(0,200),history:history.slice(0,20)}))}catch{}}
